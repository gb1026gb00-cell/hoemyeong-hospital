<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE EIGHTH DOOR : 회명병원</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a13; color: #eee4f4; font-family: system-ui, -apple-system, sans-serif; }
  button { font: inherit; cursor: pointer; color: inherit; }
  
  #app { height: 100vh; height: 100dvh; max-width: 480px; margin: auto; display: flex; flex-direction: column; padding: 12px; gap: 9px; background: linear-gradient(#1e1526, #0d0a13); }
  header { display: flex; justify-content: space-between; align-items: center; min-height: 42px; }
  header strong { font-size: 16px; }
  header small { display: block; font-size: 11px; color: #b5a3c5; }
  
  .scene { position: relative; flex: 1; min-height: 0; overflow: hidden; border: 1px solid #675371; border-radius: 13px; background: #201a27; }
  .scene img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(.82); }
  
  .hot { position: absolute; border: 1px solid #a989c9; background: #160e21b8; border-radius: 20px; padding: 6px 9px; font-size: 12px; box-shadow: 0 0 12px #b06ce755; cursor: pointer; }
  
  .narrative { background: #21192c; border: 1px solid #594566; border-radius: 10px; padding: 11px 13px; font-size: 13px; line-height: 1.45; min-height: 54px; }
  nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  nav button { background: #2c2138; border: 1px solid #6c557c; border-radius: 10px; min-height: 53px; font-size: 12px; }
  nav b { display: block; font-size: 18px; }

  /* 인트로 6초 커버 (한자 3초 -> 외관 3초 -> 자동 소멸) */
  #introCover { position: fixed; inset: 0; background: #09060e; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: opacity 0.5s ease; }
  #introCover h1 { font-size: 40px; letter-spacing: 8px; margin: 0; color: #f3e3fa; text-shadow: 0 0 20px #b06ce755; }
  #introCover p { font-size: 14px; color: #b5a3c5; margin-top: 10px; }
  #introCover.fade-out { opacity: 0; pointer-events: none; }

  /* 멀티플레이 대기실 버튼 */
  #hmCoopOpen { position: fixed; z-index: 50; top: 12px; right: 12px; background: #21172be8; color: #f6eafa; border: 1px solid #a38bb7; border-radius: 12px; padding: 8px 12px; font-weight: 600; font-size: 13px; }
  #hmCoopPanel { position: fixed; z-index: 1000; inset: 0; background: #100e16f5; color: #f1e9f4; overflow: auto; padding: 24px 16px; font-size: 14px; }
  #hmCoopPanel[hidden] { display: none !important; }
  #hmCoopPanel input, #hmCoopPanel select { width: 100%; min-height: 42px; background: #251d2d; color: #fff; border: 1px solid #786483; border-radius: 9px; padding: 8px; margin-top: 4px; margin-bottom: 10px; }
  #hmCoopPanel button { border: 1px solid #786483; background: #382846; color: white; border-radius: 10px; padding: 10px 13px; margin: 4px 4px 4px 0; font-weight: 600; }
</style>
</head>
<body>

<button id="hmCoopOpen" type="button">👥 멀티플레이 대기실</button>
<section id="hmCoopPanel" hidden>
  <div style="max-width:470px; margin:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>회명병원 · 멀티플레이 대기실</h2>
      <button id="hmCoopClose" type="button">닫기 ✕</button>
    </div>
    <label>서버 주소 (WSS)</label><input id="hmEndpoint" value="wss://hoemyeong-hospital.onrender.com"/>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:9px;">
      <div><label>방 코드</label><input id="hmRoom" value="208"/></div>
      <div><label>인원 (2~8인)</label><select id="hmCapacity"><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option></select></div>
    </div>
    <label>조사원 선택</label>
    <select id="hmCharacter">
      <option value="0">홍중</option><option value="1">성화</option><option value="2">윤호</option><option value="3">여상</option>
      <option value="4">산</option><option value="5">민기</option><option value="6">우영</option><option value="7">종호</option>
    </select>
    <button id="hmJoin" type="button">방 입장</button>
    <button id="hmLeave" type="button" disabled>퇴장</button>
    <button id="hmReady" type="button" disabled>준비 완료</button>
    <button id="hmStart" type="button" disabled>게임 시작 (방장)</button>
    <div id="hmCoopStatus" style="background:#201b29; padding:10px; border-radius:8px; margin-top:10px;">서버 대기 중...</div>
    <div id="hmCoopMembers" style="background:#201b29; padding:10px; border-radius:8px; margin-top:10px;">참가자 없음</div>
  </div>
</section>

<!-- 인트로 6초 커버 (한자 3초 -> 외관 3초 후 사라짐) -->
<div id="introCover">
  <h1 id="introTitle">回明病院</h1>
  <p id="introSub">THE EIGHTH DOOR · 회명병원</p>
</div>

<div id="app">
  <header>
    <div><strong id="sceneTitle">CH.01 · 접수실</strong><small id="roleDisplay">역할 미배정</small></div>
    <button id="audioToggle" type="button">🔊</button>
  </header>

  <div class="scene" id="mainScene">
    <img id="sceneImage" src="reception.webp" alt="접수실 전경" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'400\' height=\'400\'><rect width=\'100%\' height=\'100%\' fill=\'%23111\'/><text x=\'50%\' y=\'50%\' fill=\'%23fff\' font-size=\'20\' text-anchor=\'middle\'>접수실 이미지 로딩중</text></svg>'"/>
    
    <!-- 접수실(CH.01) 핫스팟 -->
    <button class="hot" data-action="desk" style="left:35%;top:75%">접수대</button>
    <button class="hot" data-action="mirror" style="left:45%;top:25%">거울</button>
    <!-- CH.01 전화 비활성: G15는 CH.04 원무과 이벤트 전용 -->
    <button class="hot" data-action="cabinet" style="right:10%;top:45%">서류함</button>
    <button class="hot" data-action="bell" style="left:52%;top:65%;background:#501b1bb8">호출벨</button>
  </div>

  <section id="ch01PuzzlePanel" hidden aria-label="접수실 협동 조사" style="max-height:34dvh;overflow:auto;background:#21192c;border:1px solid #675371;border-radius:10px;padding:10px;font-size:13px;">
    <strong>CH.01 · 분리 조사</strong><p id="ch01Result" style="white-space:pre-wrap;line-height:1.5">각 조사실의 기록을 확인하세요.</p>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;">
      <button type="button" data-ch01="inspect" data-object="intercom">내선 기록 조사</button>
      <button type="button" data-ch01="inspect" data-object="desk">기록 재조사</button>
      <button type="button" data-ch01="inspect" data-object="cabinet">잠긴 보관함 조사</button>
      <button type="button" data-ch01="inspect" data-object="mirror">거울 조사</button>
      <label style="grid-column:1/-1">담당 제어판 암호<input id="panelAnswer" inputmode="numeric" placeholder="다른 조사원이 전달한 단서로 계산" style="width:100%;min-height:40px"></label>
      <button type="button" data-ch01="solve">담당 제어판 해제</button>
      <button type="button" data-ch01="fragment_search" data-site="cabinet">균열 파편 조사</button>
      <button type="button" data-ch01="ch02_enter">다음 구역 이동 (방장)</button>
    </div>
    <div style="display:grid;gap:6px;margin-top:9px">
      <label>감각 번호 (0~7)<input id="senseIndex" type="number" min="0" max="7" value="0" style="width:100%;min-height:40px"></label>
      <label>장치 조작 순서<input id="senseSequence" placeholder="관찰한 조작 순서" style="width:100%;min-height:40px"></label>
      <button type="button" data-ch01="sense_interaction">감각 장치 조작</button>
      <label>해독 답<input id="senseAnswer" placeholder="감각 문제의 답" style="width:100%;min-height:40px"></label>
      <label>다른 감각의 교차 열쇠<input id="senseCrossKey" placeholder="다른 조사원이 알려준 열쇠" style="width:100%;min-height:40px"></label>
      <button type="button" data-ch01="sense_challenge">감각 문제 해독</button>
      <label>획득한 숫자 조각<input id="senseDigit" type="number" min="1" max="9" style="width:100%;min-height:40px"></label>
      <button type="button" data-ch01="sense_submit">숫자 조각 등록</button>
      <label>증거 번호 (0~2)<input id="evidenceIndex" type="number" min="0" max="2" value="0" style="width:100%;min-height:40px"></label>
      <button type="button" data-ch01="evidence_inspect">증거 수집</button>
      <label>모순의 병실 번호<input id="evidenceAnswer" inputmode="numeric" style="width:100%;min-height:40px"></label>
      <button type="button" data-ch01="evidence_submit">공동 수사판 판정</button>
      <label>8자리 심전도 복원 배열<input id="ecgAnswer" inputmode="numeric" maxlength="8" style="width:100%;min-height:40px"></label>
      <button type="button" data-ch01="ecg_submit">심전도 복원</button>
    </div>
  </section>
  <section id="ch02PuzzlePanel" hidden aria-label="208호 협동 조사" style="max-height:38dvh;overflow:auto;background:#21192c;border:1px solid #675371;border-radius:10px;padding:10px;font-size:13px;">
    <strong>CH.02 · 208호</strong><p id="ch02Result" style="white-space:pre-wrap;line-height:1.5">환자 기록과 병실을 조사하세요.</p>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px">
      <button type="button" data-ch02="ch02_explore" data-object="bed">침대 조사</button>
      <button type="button" data-ch02="ch02_explore" data-object="drawer">서랍 조사</button>
      <button type="button" data-ch02="ch02_explore" data-object="monitor">모니터 조사</button>
      <button type="button" data-ch02="ch02_inspect" data-station="chart">환자 차트</button>
      <button type="button" data-ch02="ch02_inspect" data-station="camera">CCTV 기록</button>
      <button type="button" data-ch02="ch02_corridor">복도 확인</button>
      <button type="button" data-ch02="ch02_room302">302호 문틈</button>
      <button type="button" data-ch02="ch02_wheelchair">휠체어</button>
      <label style="grid-column:1/-1">퇴실 기록 암호<input id="ch02Answer" inputmode="numeric" style="width:100%;min-height:40px"></label>
      <button type="button" data-ch02="ch02_unlock">병실 잠금 해제</button>
      <button type="button" data-ch02="ch02_switch">안전장치 고정</button>
      <button type="button" data-ch02="ch02_pressure" data-valve="1">밸브 1</button>
      <button type="button" data-ch02="ch02_pressure" data-valve="2">밸브 2</button>
      <button type="button" data-ch02="ch02_pressure" data-valve="3">밸브 3</button>
      <button type="button" data-ch02="fragment_search" data-site="drawer">서랍의 제0유물 파편</button>
      <button type="button" data-ch02="ch03_enter">CH.03 이동 (방장)</button>
    </div>
  </section>
  <section id="ch03PuzzlePanel" hidden aria-label="엘리베이터 협동 조사" style="max-height:38dvh;overflow:auto;background:#21192c;border:1px solid #675371;border-radius:10px;padding:10px;font-size:13px">
    <strong>CH.03 · 엘리베이터</strong><p id="ch03Result" style="white-space:pre-wrap;line-height:1.5">서로 다른 조사원의 단서를 모아 비상 패널을 해제하세요.</p>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px">
      <button type="button" data-ch03="ch03_explore" data-object="panel">층수 패널 조사</button>
      <button type="button" data-ch03="ch03_explore" data-object="mirror">엘리베이터 거울</button>
      <button type="button" data-ch03="ch03_explore" data-object="speaker">스피커 조사</button>
      <button type="button" data-ch03="ch03_clue" data-station="log">운행 일지</button>
      <button type="button" data-ch03="ch03_clue" data-station="reflection">반사면 분석</button>
      <label style="grid-column:1/-1">비상 패널 암호<input id="ch03Answer" inputmode="numeric" style="width:100%;min-height:40px"></label>
      <button type="button" data-ch03="ch03_submit">비상 패널 해제</button>
      <button type="button" data-ch03="fragment_search" data-site="mirror">거울 틈의 제0유물 파편</button>
      <button type="button" data-ch03="ch04_enter">CH.04 이동 (방장)</button>
    </div>
  </section>
  <section id="ch04PuzzlePanel" hidden aria-label="기록보관실 협동 조사" style="max-height:38dvh;overflow:auto;background:#21192c;border:1px solid #675371;border-radius:10px;padding:10px;font-size:13px">
    <strong>CH.04 · 기록보관실</strong><p id="ch04Result" style="white-space:pre-wrap;line-height:1.5">기록을 대조해 사건을 재구성하세요.</p>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px">
      <button type="button" data-ch04="ch04_inspect" data-object="ledger">퇴실 대장</button>
      <button type="button" data-ch04="ch04_inspect" data-object="camera">감시 영상 기록</button>
      <button type="button" data-ch04="ch04_inspect" data-object="call">내선 통화 기록</button>
      <button type="button" data-ch04="ch04_inspect" data-object="tag">봉인된 문서</button>
      <button type="button" data-ch04="ch04_surgery_record">수술 기록 조사</button>
      <button type="button" data-ch04="ch04_witness" data-station="human">사람의 기록</button>
      <button type="button" data-ch04="ch04_witness" data-station="machine">기계의 기록</button>
      <button type="button" data-ch04="horror_inspect" data-site="cctv">CCTV 화면 조사</button>
      <button type="button" data-ch04="horror_inspect" data-site="admissions_phone">원무과 전화 조사</button>
      <button type="button" data-ch04="horror_inspect" data-site="mortuary_drawer">영안실 서랍 조사</button>
      <label style="grid-column:1/-1">사건 재구성
        <select id="ch04Answer" style="width:100%;min-height:40px"><option value="">결론 선택</option><option value="inside">환자는 병실 안에 남았다</option><option value="outside">환자는 병실 밖으로 나갔다</option></select>
      </label>
      <button type="button" data-ch04="ch04_vote">재구성 동의 (각 조사원)</button>
      <button type="button" data-ch04="fragment_search" data-site="ledger">퇴실 대장의 제0유물 파편</button>
      <button type="button" data-ch04="ch05_enter">CH.05 이동 (방장)</button>
    </div>
  </section>
  <div class="narrative" id="line">접수실 호출벨을 누르거나 사물을 조사해 조사를 시작하세요.</div>

  <nav>
    <button type="button" id="tabInspect"><b>🔍</b>조사</button>
    <button type="button" id="tabInventory"><b>🎒</b>소지품</button>
    <button type="button" id="tabHint"><b>💡</b>수사판</button>
    <button type="button" id="tabMove"><b>🚪</b>이동</button>
  </nav>
</div>

<script>
(function(){
  // 인트로 6초 타이머 (3초 후 텍스트 변경 또는 외관 전환 -> 3초 후 커버 제거)
  setTimeout(()=>{
    const title = document.getElementById('introTitle');
    const sub = document.getElementById('introSub');
    if(title && sub) {
      title.textContent = "回明病院 입구";
      sub.textContent = "안개 자욱한 병원 외관";
    }
    setTimeout(()=>{
      const cover = document.getElementById('introCover');
      if(cover) {
        cover.classList.add('fade-out');
        setTimeout(()=> cover.remove(), 500);
      }
    }, 3000);
  }, 3000);

  // 대기실 제어
  const coopOpen = document.getElementById('hmCoopOpen');
  const coopPanel = document.getElementById('hmCoopPanel');
  const coopClose = document.getElementById('hmCoopClose');
  
  if(coopOpen) coopOpen.onclick = () => coopPanel.hidden = false;
  if(coopClose) coopClose.onclick = () => coopPanel.hidden = true;

  // 웹소켓 및 게임 로직 연결
  const hmEndpoint = document.getElementById('hmEndpoint');
  const hmRoom = document.getElementById('hmRoom');
  const hmCapacity = document.getElementById('hmCapacity');
  const hmCharacter = document.getElementById('hmCharacter');
  const hmJoin = document.getElementById('hmJoin');
  const hmLeave = document.getElementById('hmLeave');
  const hmReady = document.getElementById('hmReady');
  const hmStart = document.getElementById('hmStart');
  const coopStatus = document.getElementById('hmCoopStatus');
  const coopMembers = document.getElementById('hmCoopMembers');

  let ws = null, token = null, myRole = null, isHost = false, joined = false, started = false;
  let currentPhase = 'reception';
  let lastStarted = false;
  const ch01Panel = document.getElementById("ch01PuzzlePanel");
  const ch04Panel=document.getElementById("ch04PuzzlePanel");
  const ch04Result=document.getElementById("ch04Result");
  ch04Panel.addEventListener("click",e=>{const b=e.target.closest("[data-ch04]");if(!b)return;const action=b.dataset.ch04,extra={};if(b.dataset.object)extra.object=b.dataset.object;if(b.dataset.station)extra.station=b.dataset.station;if(b.dataset.site)extra.site=b.dataset.site;if(action==="ch04_vote")extra.answer=document.getElementById("ch04Answer").value;chapterSend(action,extra);});
  const ch03Panel=document.getElementById("ch03PuzzlePanel");
  const ch03Result=document.getElementById("ch03Result");
  ch03Panel.addEventListener("click",e=>{const b=e.target.closest("[data-ch03]");if(!b)return;const action=b.dataset.ch03,extra={};if(b.dataset.object)extra.object=b.dataset.object;if(b.dataset.station)extra.station=b.dataset.station;if(b.dataset.site)extra.site=b.dataset.site;if(action==="ch03_submit")extra.answer=document.getElementById("ch03Answer").value.trim();chapterSend(action,extra);});
  const ch02Panel = document.getElementById("ch02PuzzlePanel");
  const ch02Result = document.getElementById("ch02Result");
  ch02Panel.addEventListener("click",e=>{const b=e.target.closest("[data-ch02]");if(!b)return;const action=b.dataset.ch02;const extra={};if(b.dataset.object)extra.object=b.dataset.object;if(b.dataset.station)extra.station=b.dataset.station;if(b.dataset.site)extra.site=b.dataset.site;if(b.dataset.valve)extra.valve=Number(b.dataset.valve);if(action==="ch02_unlock")extra.answer=document.getElementById("ch02Answer").value.trim();chapterSend(action,extra);});
  const ch01Result = document.getElementById("ch01Result");
  function chapterSend(action, extra={}) { if(!ws || ws.readyState!==WebSocket.OPEN || !started) { ch01Result.textContent="게임 시작 후 조사할 수 있어요."; return; } ws.send(JSON.stringify({type:"chapter",action,...extra})); }
  ch01Panel.addEventListener("click", e => { const btn=e.target.closest("[data-ch01]"); if(!btn)return; const action=btn.dataset.ch01; const val=id=>document.getElementById(id)?.value.trim()||""; const extra=btn.dataset.object?{object:btn.dataset.object}:btn.dataset.site?{site:btn.dataset.site}:{}; if(["sense_interaction","sense_challenge","sense_submit"].includes(action))extra.index=Number(val("senseIndex")); if(action==="sense_interaction")extra.sequence=val("senseSequence"); if(action==="sense_challenge"){extra.answer=val("senseAnswer");extra.crossKey=val("senseCrossKey");} if(action==="sense_submit")extra.digit=Number(val("senseDigit")); if(action==="evidence_inspect")extra.index=Number(val("evidenceIndex")); if(action==="evidence_submit")extra.answer=val("evidenceAnswer"); if(action==="ecg_submit")extra.answer=val("ecgAnswer"); if(action==="solve")extra.answer=val("panelAnswer"); chapterSend(action,extra); });
  const charNames = ['홍중','성화','윤호','여상','산','민기','우영','종호'];

  if(hmJoin) {
    hmJoin.onclick = () => {
      const url = hmEndpoint.value.trim();
      const room = hmRoom.value.trim().toUpperCase();
      const cap = parseInt(hmCapacity.value, 10);
      const charIdx = parseInt(hmCharacter.value, 10);

      if(ws && ws.readyState <= WebSocket.OPEN) return;
      if(!/^wss:\/\//.test(url) || !/^[A-Z0-9_-]{1,12}$/.test(room)){ coopStatus.textContent='서버 주소 또는 방 코드를 확인해 주세요.'; return; }
      coopStatus.textContent='서버 연결 중...';
      try { ws = new WebSocket(url); } catch(e) { coopStatus.textContent='연결 주소 오류: '+e.message; return; }
      ws.onopen = () => {
        coopStatus.textContent = "서버 연결됨. 입장 중...";
        ws.send(JSON.stringify({ type:'join', room, role:charIdx, character:charIdx, capacity:cap, token }));
      };
      ws.onmessage = e => {
        try {
          const data = JSON.parse(e.data);
          if(data.type === 'error') { coopStatus.textContent='오류: '+data.message; return; }
          if(data.type === 'joined' || data.type === 'state') {
            if(data.chapter && typeof data.chapter.phase === 'string') {
              currentPhase = data.chapter.phase;
              ch01Panel.hidden = !started || !['separated','escaped'].includes(currentPhase);
              ch02Panel.hidden = !started || !['ch02','ch02_cleared'].includes(currentPhase);
              ch03Panel.hidden = !started || !['ch03','ch03_cleared'].includes(currentPhase);
              ch04Panel.hidden = !started || !['ch04','ch04_cleared'].includes(currentPhase);
              document.getElementById('sceneTitle').textContent = '회명병원 · '+currentPhase;
              if(Array.isArray(data.chapter.solved)) document.getElementById('line').textContent = '서버 동기화 · 진행 단계: '+currentPhase+' · 완료한 퍼즐: '+data.chapter.solved.length;
            }
            if(data.started === true) {
              started = true;
              if(!lastStarted) { lastStarted = true; coopPanel.hidden = true; }
              ch01Panel.hidden = !['separated','escaped'].includes(currentPhase);
              ch02Panel.hidden = !['ch02','ch02_cleared'].includes(currentPhase);
              ch03Panel.hidden = !['ch03','ch03_cleared'].includes(currentPhase);
              ch04Panel.hidden = !['ch04','ch04_cleared'].includes(currentPhase);
            }
            if(data.token){ token = data.token; localStorage.setItem('hm-token', token); }
            myRole = data.yourRole ?? myRole;
            if(data.type === 'joined') { joined = true; isHost = !!data.isHost; hmJoin.disabled=true; }
            if(data.started) started=true;
            if(data.members) {
              if(data.type === 'state') isHost = data.members.some(m => m.role === myRole && m.host === true);
              hmCapacity.value = String(data.capacity || hmCapacity.value);
              hmCapacity.disabled = true;
              hmCharacter.disabled = true;
              coopMembers.style.whiteSpace = 'pre-line';
              coopMembers.textContent = data.members.map(m => `[${charNames[m.character]||'조사원'}] ${m.ready?'준비완료':'대기중'}${m.host?' (방장)':''}`).join('\n');
              hmReady.disabled = started;
              hmStart.disabled = !isHost || started;
              hmLeave.disabled = false;
            }
            coopStatus.textContent = `${started?'진행 중':'입장 성공'} · ${charNames[myRole]||myRole} · ${data.members?.filter(m=>m.online!==false).length||0}명 연결`;
            document.getElementById('roleDisplay').textContent = `담당: ${charNames[myRole]||'조사원'}`;
          }
          if(['sense_interaction_result','sense_challenge_result','sense_result','evidence_result','evidence_verdict','ecg_result'].includes(data.type)) ch01Result.textContent=(data.message||'')+(data.digit?'\n획득 숫자: '+data.digit:'')+(data.text?'\n'+data.text:'');
          if(data.type === 'ch02_event' || data.type === 'ch02_result') ch02Result.textContent = data.message || '208호 조사 상태가 변경됐습니다.';
          if(data.type === 'ch03_event' || data.type === 'ch03_result') ch03Result.textContent = data.message || '엘리베이터 조사 상태가 변경됐습니다.';
          if(data.type === 'ch04_event' || data.type === 'ch04_result') ch04Result.textContent = data.message || '기록보관실 조사 상태가 변경됐습니다.';
          if(data.type === 'inspection') { ch01Result.textContent = (data.room?data.room+'\n':'')+(data.description||'')+(data.clue?'\n전달할 암호: '+data.clue.code+' → 조사원 '+data.clue.target:''); }
          if(data.type === 'chapter_result' || data.type === 'fragment_result' || data.type === 'ch02_result') ch01Result.textContent = data.message || JSON.stringify(data);
          if(data.type === 'chapter_event') ch01Result.textContent = ({blackout:'정전 발생. 조사원들이 각 조사실로 분리되었습니다.',escape:'모든 조사실 봉인 해제 완료. 접수실 서류함에서 제0유물 파편을 찾아 다음 구역으로 이동하세요.',sense_locked:'심전도 복원을 먼저 완료해야 합니다.',wrong:'제어판 암호가 틀렸습니다. 전달받은 숫자와 담당 조사실 규칙을 다시 확인하세요.',solved:'제어판 봉인이 해제되었습니다. 다른 조사원의 해제를 기다리세요.'})[data.event] || data.message || '새로운 사건 발생';
          if(data.type === 'started') {
            started=true; lastStarted=true; coopStatus.textContent='게임 시작 신호 수신';
            hmReady.disabled=true; hmStart.disabled=true;
            coopPanel.hidden = true;
          }
        } catch(err){ console.error(err); }
      };
      ws.onerror = () => coopStatus.textContent = '웹소켓 연결 실패 · 서버 상태를 확인해 주세요.';
      ws.onclose = () => { ch01Panel.hidden=true; ch02Panel.hidden=true; ch03Panel.hidden=true; ch04Panel.hidden=true; joined=false; started=false; lastStarted=false; isHost=false; hmCapacity.disabled=false; hmCharacter.disabled=false; hmJoin.disabled=false; hmReady.disabled=true; hmStart.disabled=true; hmLeave.disabled=true; coopStatus.textContent='연결 종료 · 다시 입장해 주세요.'; };
    };
  }

  if(hmReady) hmReady.onclick = () => { if(joined && ws?.readyState===WebSocket.OPEN) ws.send(JSON.stringify({ type:'ready', ready:true })); };
  if(hmStart) hmStart.onclick = () => { if(joined && isHost && ws?.readyState===WebSocket.OPEN) ws.send(JSON.stringify({ type:'start' })); };
  if(hmLeave) hmLeave.onclick = () => { if(ws) ws.close(); location.reload(); };

  // 핫스팟 터치
  document.querySelectorAll('.hot').forEach(btn => {
    btn.onclick = () => {
      const action = btn.dataset.action;
      if(!ws || ws.readyState !== WebSocket.OPEN || !started) return alert('두 조사원이 입장하고 게임을 시작한 뒤 조사할 수 있어요.');
      if(currentPhase !== 'reception' && currentPhase !== 'separated') return alert('현재 단계는 전용 퍼즐 화면에서 조사해야 합니다.');
      if(action === 'bell') {
        ws.send(JSON.stringify({ type:'chapter', action:'bell' }));
      } else {
        ws.send(JSON.stringify({ type:'chapter', action:'inspect', object:action }));
      }
    };
  });
})();
</script>
</body>
</html>
