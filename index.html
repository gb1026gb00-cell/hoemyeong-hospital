<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE EIGHTH DOOR : 회명병원</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a13; color: #eee4f4; font-family: system-ui, -apple-system, sans-serif; }
  button { font: inherit; cursor: pointer; color: inherit; }
  
  #app { height: 100vh; height: 100dvh; max-width: 480px; margin: auto; display: flex; flex-direction: column; padding: 12px; gap: 9px; background: linear-gradient(#1e1526, #0d0a13); }
  header { display: flex; justify-content: space-between; align-items: center; min-height: 42px; }
  header strong { font-size: 16px; }
  header small { display: block; font-size: 11px; color: #b5a3c5; }
  
  .scene { position: relative; flex: 1; min-height: 0; overflow: hidden; border: 1px solid #675371; border-radius: 13px; background: #201a27; }
  .scene img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(.82); }
  
  .hot { position: absolute; border: 1px solid #a989c9; background: #160e21b8; border-radius: 20px; padding: 6px 9px; font-size: 12px; box-shadow: 0 0 12px #b06ce755; cursor: pointer; }
  
  .narrative { background: #21192c; border: 1px solid #594566; border-radius: 10px; padding: 11px 13px; font-size: 13px; line-height: 1.45; min-height: 54px; }
  nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  nav button { background: #2c2138; border: 1px solid #6c557c; border-radius: 10px; min-height: 53px; font-size: 12px; }
  nav b { display: block; font-size: 18px; }

  /* 인트로 6초 커버 (한자 3초 -> 외관 3초 -> 자동 소멸) */
  #introCover { position: fixed; inset: 0; background: #09060e; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: opacity 0.5s ease; }
  #introCover h1 { font-size: 40px; letter-spacing: 8px; margin: 0; color: #f3e3fa; text-shadow: 0 0 20px #b06ce755; }
  #introCover p { font-size: 14px; color: #b5a3c5; margin-top: 10px; }
  #introCover.fade-out { opacity: 0; pointer-events: none; }

  /* 멀티플레이 대기실 버튼 */
  #hmCoopOpen { position: fixed; z-index: 50; top: 12px; right: 12px; background: #21172be8; color: #f6eafa; border: 1px solid #a38bb7; border-radius: 12px; padding: 8px 12px; font-weight: 600; font-size: 13px; }
  #hmCoopPanel { position: fixed; z-index: 1000; inset: 0; background: #100e16f5; color: #f1e9f4; overflow: auto; padding: 24px 16px; font-size: 14px; }
  #hmCoopPanel[hidden] { display: none !important; }
  #hmCoopPanel input, #hmCoopPanel select { width: 100%; min-height: 42px; background: #251d2d; color: #fff; border: 1px solid #786483; border-radius: 9px; padding: 8px; margin-top: 4px; margin-bottom: 10px; }
  #hmCoopPanel button { border: 1px solid #786483; background: #382846; color: white; border-radius: 10px; padding: 10px 13px; margin: 4px 4px 4px 0; font-weight: 600; }
</style>
</head>
<body>

<button id="hmCoopOpen" type="button">👥 멀티플레이 대기실</button>
<section id="hmCoopPanel" hidden>
  <div style="max-width:470px; margin:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>회명병원 · 멀티플레이 대기실</h2>
      <button id="hmCoopClose" type="button">닫기 ✕</button>
    </div>
    <label>서버 주소 (WSS)</label><input id="hmEndpoint" value="wss://hoemyeong-hospital.onrender.com"/>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:9px;">
      <div><label>방 코드</label><input id="hmRoom" value="208"/></div>
      <div><label>인원 (2~8인)</label><select id="hmCapacity"><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option></select></div>
    </div>
    <label>조사원 선택</label>
    <select id="hmCharacter">
      <option value="0">홍중</option><option value="1">성화</option><option value="2">윤호</option><option value="3">여상</option>
      <option value="4">산</option><option value="5">민기</option><option value="6">우영</option><option value="7">종호</option>
    </select>
    <button id="hmJoin" type="button">방 입장</button>
    <button id="hmLeave" type="button" disabled>퇴장</button>
    <button id="hmReady" type="button" disabled>준비 완료</button>
    <button id="hmStart" type="button" disabled>게임 시작 (방장)</button>
    <div id="hmCoopStatus" style="background:#201b29; padding:10px; border-radius:8px; margin-top:10px;">서버 대기 중...</div>
    <div id="hmCoopMembers" style="background:#201b29; padding:10px; border-radius:8px; margin-top:10px;">참가자 없음</div>
  </div>
</section>

<!-- 인트로 6초 커버 (한자 3초 -> 외관 3초 후 사라짐) -->
<div id="introCover">
  <h1 id="introTitle">回明病院</h1>
  <p id="introSub">THE EIGHTH DOOR · 회명병원</p>
</div>

<div id="app">
  <header>
    <div><strong id="sceneTitle">CH.01 · 접수실</strong><small id="roleDisplay">역할 미배정</small></div>
    <button id="audioToggle" type="button">🔊</button>
  </header>

  <div class="scene" id="mainScene">
    <img id="sceneImage" src="reception.webp" alt="접수실 전경" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'400\' height=\'400\'><rect width=\'100%\' height=\'100%\' fill=\'%23111\'/><text x=\'50%\' y=\'50%\' fill=\'%23fff\' font-size=\'20\' text-anchor=\'middle\'>접수실 이미지 로딩중</text></svg>'"/>
    
    <!-- 접수실(CH.01) 핫스팟 -->
    <button class="hot" data-action="desk" style="left:35%;top:75%">접수대</button>
    <button class="hot" data-action="mirror" style="left:45%;top:25%">거울</button>
    <!-- CH.01 전화 비활성: G15는 CH.04 원무과 이벤트 전용 -->
    <button class="hot" data-action="cabinet" style="right:10%;top:45%">서류함</button>
    <button class="hot" data-action="bell" style="left:52%;top:65%;background:#501b1bb8">호출벨</button>
  </div>

  <div class="narrative" id="line">접수실 호출벨을 누르거나 사물을 조사해 조사를 시작하세요.</div>

  <nav>
    <button type="button" id="tabInspect"><b>🔍</b>조사</button>
    <button type="button" id="tabInventory"><b>🎒</b>소지품</button>
    <button type="button" id="tabHint"><b>💡</b>수사판</button>
    <button type="button" id="tabMove"><b>🚪</b>이동</button>
  </nav>
</div>

<script>
(function(){
  // 인트로 6초 타이머 (3초 후 텍스트 변경 또는 외관 전환 -> 3초 후 커버 제거)
  setTimeout(()=>{
    const title = document.getElementById('introTitle');
    const sub = document.getElementById('introSub');
    if(title && sub) {
      title.textContent = "回明病院 입구";
      sub.textContent = "안개 자욱한 병원 외관";
    }
    setTimeout(()=>{
      const cover = document.getElementById('introCover');
      if(cover) {
        cover.classList.add('fade-out');
        setTimeout(()=> cover.remove(), 500);
      }
    }, 3000);
  }, 3000);

  // 대기실 제어
  const coopOpen = document.getElementById('hmCoopOpen');
  const coopPanel = document.getElementById('hmCoopPanel');
  const coopClose = document.getElementById('hmCoopClose');
  
  if(coopOpen) coopOpen.onclick = () => coopPanel.hidden = false;
  if(coopClose) coopClose.onclick = () => coopPanel.hidden = true;

  // 웹소켓 및 게임 로직 연결
  const hmEndpoint = document.getElementById('hmEndpoint');
  const hmRoom = document.getElementById('hmRoom');
  const hmCapacity = document.getElementById('hmCapacity');
  const hmCharacter = document.getElementById('hmCharacter');
  const hmJoin = document.getElementById('hmJoin');
  const hmLeave = document.getElementById('hmLeave');
  const hmReady = document.getElementById('hmReady');
  const hmStart = document.getElementById('hmStart');
  const coopStatus = document.getElementById('hmCoopStatus');
  const coopMembers = document.getElementById('hmCoopMembers');

  let ws = null, token = null, myRole = null, isHost = false, joined = false, started = false;
  let currentPhase = 'reception';
  let lastStarted = false;
  const charNames = ['홍중','성화','윤호','여상','산','민기','우영','종호'];

  if(hmJoin) {
    hmJoin.onclick = () => {
      const url = hmEndpoint.value.trim();
      const room = hmRoom.value.trim().toUpperCase();
      const cap = parseInt(hmCapacity.value, 10);
      const charIdx = parseInt(hmCharacter.value, 10);

      if(ws && ws.readyState <= WebSocket.OPEN) return;
      if(!/^wss:\/\//.test(url) || !/^[A-Z0-9_-]{1,12}$/.test(room)){ coopStatus.textContent='서버 주소 또는 방 코드를 확인해 주세요.'; return; }
      coopStatus.textContent='서버 연결 중...';
      try { ws = new WebSocket(url); } catch(e) { coopStatus.textContent='연결 주소 오류: '+e.message; return; }
      ws.onopen = () => {
        coopStatus.textContent = "서버 연결됨. 입장 중...";
        ws.send(JSON.stringify({ type:'join', room, role:charIdx, character:charIdx, capacity:cap, token }));
      };
      ws.onmessage = e => {
        try {
          const data = JSON.parse(e.data);
          if(data.type === 'error') { coopStatus.textContent='오류: '+data.message; return; }
          if(data.type === 'joined' || data.type === 'state') {
            if(data.chapter && typeof data.chapter.phase === 'string') {
              currentPhase = data.chapter.phase;
              document.getElementById('sceneTitle').textContent = '회명병원 · '+currentPhase;
              if(Array.isArray(data.chapter.solved)) document.getElementById('line').textContent = '서버 동기화 · 진행 단계: '+currentPhase+' · 완료한 퍼즐: '+data.chapter.solved.length;
            }
            if(data.started === true) {
              started = true;
              if(!lastStarted) { lastStarted = true; coopPanel.hidden = true; }
            }
            if(data.token){ token = data.token; localStorage.setItem('hm-token', token); }
            myRole = data.yourRole ?? myRole;
            if(data.type === 'joined') { joined = true; isHost = !!data.isHost; hmJoin.disabled=true; }
            if(data.started) started=true;
            if(data.members) {
              if(data.type === 'state') isHost = data.members.some(m => m.role === myRole && m.host === true);
              hmCapacity.value = String(data.capacity || hmCapacity.value);
              hmCapacity.disabled = true;
              hmCharacter.disabled = true;
              coopMembers.style.whiteSpace = 'pre-line';
              coopMembers.textContent = data.members.map(m => `[${charNames[m.character]||'조사원'}] ${m.ready?'준비완료':'대기중'}${m.host?' (방장)':''}`).join('\n');
              hmReady.disabled = started;
              hmStart.disabled = !isHost || started;
              hmLeave.disabled = false;
            }
            coopStatus.textContent = `${started?'진행 중':'입장 성공'} · ${charNames[myRole]||myRole} · ${data.members?.filter(m=>m.online!==false).length||0}명 연결`;
            document.getElementById('roleDisplay').textContent = `담당: ${charNames[myRole]||'조사원'}`;
          }
          if(data.type === 'started') {
            started=true; lastStarted=true; coopStatus.textContent='게임 시작 신호 수신';
            hmReady.disabled=true; hmStart.disabled=true;
            coopPanel.hidden = true;
          }
        } catch(err){ console.error(err); }
      };
      ws.onerror = () => coopStatus.textContent = '웹소켓 연결 실패 · 서버 상태를 확인해 주세요.';
      ws.onclose = () => { joined=false; started=false; lastStarted=false; isHost=false; hmCapacity.disabled=false; hmCharacter.disabled=false; hmJoin.disabled=false; hmReady.disabled=true; hmStart.disabled=true; hmLeave.disabled=true; coopStatus.textContent='연결 종료 · 다시 입장해 주세요.'; };
    };
  }

  if(hmReady) hmReady.onclick = () => { if(joined && ws?.readyState===WebSocket.OPEN) ws.send(JSON.stringify({ type:'ready', ready:true })); };
  if(hmStart) hmStart.onclick = () => { if(joined && isHost && ws?.readyState===WebSocket.OPEN) ws.send(JSON.stringify({ type:'start' })); };
  if(hmLeave) hmLeave.onclick = () => { if(ws) ws.close(); location.reload(); };

  // 핫스팟 터치
  document.querySelectorAll('.hot').forEach(btn => {
    btn.onclick = () => {
      const action = btn.dataset.action;
      if(!ws || ws.readyState !== WebSocket.OPEN || !started) return alert('두 조사원이 입장하고 게임을 시작한 뒤 조사할 수 있어요.');
      if(currentPhase !== 'reception' && currentPhase !== 'separated') return alert('현재 단계는 전용 퍼즐 화면에서 조사해야 합니다.');
      if(action === 'bell') {
        ws.send(JSON.stringify({ type:'chapter', action:'bell' }));
      } else {
        ws.send(JSON.stringify({ type:'chapter', action:'inspect', object:action }));
      }
    };
  });
})();
</script>
</body>
</html>
