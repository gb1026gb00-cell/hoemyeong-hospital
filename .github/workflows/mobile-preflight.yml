name: Mobile release preflight

on:
  push:
    branches:
      - dev/coop-v172-preserve-approved-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebSocket dependency
        run: npm install --no-audit --no-fund
      - name: Run preservation, video, and script checks
        id: static_checks
        continue-on-error: true
        run: npm test
      - name: Guard approved V172 scene preservation
        id: approved_ui
        continue-on-error: true
        run: node test_approved_v172_ui.js
      - name: Run real multiplayer reconnect checks
        id: network_checks
        continue-on-error: true
        run: npm run test:network
      - name: Exercise real two-player CH01 + video byte ranges
        id: ch01_live
        continue-on-error: true
        run: node test_ch01_live_v177.js
      - name: Verify server syntax
        id: syntax_checks
        continue-on-error: true
        run: node --check server.js
      - name: Summarize release blockers
        if: always()
        run: |
          echo "Static checks: ${{ steps.static_checks.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Approved V172 UI: ${{ steps.approved_ui.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Multiplayer checks: ${{ steps.network_checks.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "CH01 live puzzle and videos: ${{ steps.ch01_live.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Server syntax: ${{ steps.syntax_checks.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          if [ "${{ steps.static_checks.outcome }}" != success ]; then
            echo "::error title=Static preflight failed::Preservation, media, or inline-script checks failed."
            failed=1
          fi
          if [ "${{ steps.approved_ui.outcome }}" != success ]; then
            echo "::error title=Approved V172 UI missing::Restore the approved scene and horror-object layer before release."
            failed=1
          fi
          if [ "${{ steps.network_checks.outcome }}" != success ]; then
            echo "::error title=Multiplayer smoke test failed::Check the 2-player and 4-player reconnect test output."
            failed=1
          fi
          if [ "${{ steps.ch01_live.outcome }}" != success ]; then
            echo "::error title=CH01 integration failed::Check two-player visual clues, progression and locally served videos."
            failed=1
          fi
          if [ "${{ steps.syntax_checks.outcome }}" != success ]; then
            echo "::error title=Server syntax failed::Check server.js syntax."
            failed=1
          fi
          exit "$failed"
